<!doctype html>

    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="title">
      <h1 class="name">🎬 DiscoverMovies</h1>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search movies..." />
        <button class="search-btn" id="searchBtn">
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>
      </div>
      <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme">
        🌙
      </button>
    </div>

    <nav>
      <ul class="navbar">
        <li>
          <a href="index.html" id="btn-home"
            ><i class="fa-solid fa-home"></i> Home</a
          >
        </li>
        <li>
          <a href="popular.html"><i class="fa-solid fa-fire"></i> Popular</a>
        </li>
        <li>
          <a href="toprated.html"
            ><i class="fa-solid fa-trophy"></i> Top Rated</a
          >
        </li>
        <li>
          <a href="watchlist.html"
            ><i class="fa-solid fa-bookmark"></i> Watchlist</a
          >
        </li>
        <li>
          <a href="favorites.html"
            ><i class="fa-solid fa-star"></i> Favorites</a
          >
        </li>
      </ul>
    </nav>

    <main>
      <p id="page-title">Movie Details</p>
      <section class="movie-poster">
        <div class="card"><img alt="poster" /></div>
      </section>

      <section class="movie-details">
        <h2 class="movie-title"></h2>
        <p class="movie-overview"></p>
        <p class="movie-release-date"></p>
        <p class="movie-rating"></p>
        <div class="detail-actions">
          <button class="action-btn" id="addToFavorites"><i class="fa-solid fa-star"></i>
            Add to Favorites
          </button>
          
          <button class="action-btn" id="addToWatchlist"><i class="fa-solid fa-bookmark"></i>
            Add to Watchlist
          </button>
        </div>
      </section>

      <section class="movies" id="listing-section"></section>
    </main>

    <footer>
      <p>&copy; 2026 DiscoverMovies. All rights reserved.</p>
      <p>Contact Us: info@discovermovies.com</p>
    </footer>
    <script src="scripts/api/movieApi.js"></script>
    <script src="scripts/app.js"></script>
       <canvas
      id="sparkle-canvas"
      style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 0;
      "
    ></canvas>
    <script>
      const canvas = document.getElementById("sparkle-canvas");
      const ctx = canvas.getContext("2d");
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const stars = [];
      for (let i = 0; i < 250; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() * 2.5 + 0.5,
          alpha: Math.random(),
          speed: Math.random() * 0.3 + 0.05,
          twinkleSpeed: Math.random() * 0.02 + 0.005,
          twinkleDir: Math.random() > 0.5 ? 1 : -1,
        });
      }

      function drawStars() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        stars.forEach(function (star) {
          star.alpha += star.twinkleSpeed * star.twinkleDir;
          if (star.alpha >= 1) {
            star.alpha = 1;
            star.twinkleDir = -1;
          }
          if (star.alpha <= 0) {
            star.alpha = 0;
            star.twinkleDir = 1;
          }
          star.y -= star.speed;
          if (star.y < 0) {
            star.y = canvas.height;
            star.x = Math.random() * canvas.width;
          }
          ctx.beginPath();
          ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
          ctx.fillStyle =
            "rgba(255, 220, 100, " + (star.alpha * 0.9 + 0.1) + ")";
          ctx.fill();
        });
        requestAnimationFrame(drawStars);
      }

      drawStars();

      window.addEventListener("resize", function () {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      });
    </script>
  </body>
</html>
