<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie Discovery Webapp</title>
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/responsive.css">
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="title">
      <h1 class="name">🎬MOVCOVER </h1>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search movies..." />
        <button class="search-btn" id="searchBtn">
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>
      </div>
      <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme">
        🌙
      </button>
    </div>

  <!-- HERO SECTION -->
<header class="heroHeader"></header>

<!-- MOVIES SECTION -->
<main>
  <section class="movies" id="listing-section">
    <!-- Movie cards appear here ONLY -->
  </section>
</main>

    <main>
      <nav>
        <ul class="navbar">
          <li>
            <a href="popular.html" id="btn-popular"
              ><i class="fa-solid fa-fire"></i> Popular</a
            >
          </li>
          <li>
            <a href="toprated.html" id="btn-toprated"
              ><i class="fa-solid fa-trophy"></i> Top Rated</a
            >
          </li>
          <li>
            <a href="watchlist.html"
              ><i class="fa-solid fa-bookmark"></i> Watchlist</a
            >
          </li>
          <li>
            <a href="favorites.html"
              ><i class="fa-solid fa-star"></i> Favorites</a
            >
          </li>
        </ul>
      </nav>

      <section class="poster">
        <p id="title-trending">Trending</p>
        <section class="movies" id="trending-section">
          <div class="box"><img alt="Image 1" /></div>
          <div class="box"><img alt="Image 2" /></div>
          <div class="box"><img alt="Image 3" /></div>
          <div class="box"><img alt="Image 4" /></div>
          <div class="box"><img alt="Image 5" /></div>
         
        </section>

      </section>
    </main>

    <footer>
      <p>&copy; 2026 DiscoverMovies. All rights reserved.</p>
      <p>Contact Us: info@discovermovies.com</p>
      <p><a href="about_us.html">About Us</a></p>
    </footer>
    <script src="scripts/api/movieApi.js"></script>
    <script src="scripts/app.js"></script>
  </body>
</html>
